name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at 00:00 UTC
  workflow_dispatch:       # allow manual run

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate professional snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: thummakarthikeya
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2ea44f&color_dots=#2ea44f&color_grid=#ebedf0&color_text=#24292f&hide_progress=true
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#58a6ff&color_grid=#21262d&color_text=#f0f6fc&hide_progress=true

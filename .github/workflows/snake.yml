name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate professional dark snake
        uses: Platane/snk@v3
        with:
          github_user_name: thummakarthikeya
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&hide_progress=true&color_snake=#58a6ff&color_dots=#58a6ff&color_grid=#161b22&color_text=#c9d1d9
            dist/github-contribution-grid-snake.svg?palette=github-light&hide_progress=true&color_snake=#2ea44f&color_dots=#2ea44f&color_grid=#ebedf0&color_text=#24292f

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
